name: Windows x64 build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build and test
        shell: powershell
        run: .\windows\build.ps1
      - name: Verify outputs
        shell: powershell
        run: |
          if (!(Test-Path .\dist\JARVIS-Wake-Setup.exe)) { throw "Setup EXE fehlt" }
          Get-Content .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Wake-Windows-x64
          path: |
            dist/JARVIS-Wake-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
